<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AgileJob</title>
</head>
<body>

<div class="caixa-login">
    <h1 class="titulo">Login</h1>

    <form action="" method="POST" enctype="multipart/form-data">
        
        <div class="upload-foto">
            <label for="foto" class="label-foto">
                <span>+</span>
                <p>Foto de Perfil</p>
            </label>
            <input type="file" id="foto" name="foto" accept="image/*" class="input-escondido">
        </div>

        <input type="text" placeholder="text" class="campo">
        
        <input type="password" placeholder="Senha" class="campo">

        <a type="submit" value="Entrar" class="b-entrar"></a>

    </form>

    <a href="agilejob.html" class="link-voltar">Voltar para o início</a>
</div>

<a href="redefinir.html" class="link-redefinir">Esqueceu sua senha?</a>

<style>
    body {
        background-color: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: sans-serif;
    }

    .caixa-login {
        background-color: #000;
        width: 350px;
        padding: 40px;
        border: 6px solid #a90000;
        border-radius: 20px;
        text-align: center;
    }

    .titulo {
        color: #a90000;
        margin-bottom: 25px;
        font-size: 28px;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

   
    .upload-foto {
        margin-bottom: 20px;
        display: flex;
        justify-content: center;
    }

    .label-foto {
        width: 80px;
        height: 80px;
        border: 2px dashed #a90000;
        border-radius: 50%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: 0.3s;
        color: #888;
    }

    .label-foto:hover {
        background-color: #1a0000;
        border-style: solid;
        color: #fff;
    }

    .label-foto span {
        font-size: 24px;
        font-weight: bold;
    }

    .label-foto p {
        font-size: 10px;
        margin: 0;
        text-transform: uppercase;
    }

    .input-escondido {
        display: none;
    }

    .campo {
        width: 100%;
        height: 40px;
        margin-bottom: 20px;
        border-radius: 10px;
        border: 2px solid #333; 
        padding: 10px;
        font-size: 16px;
        background-color: #fff;
        box-sizing: border-box;
    }

    .b-entrar {
        width: 100%;
        height: 45px;
        background-color: white;
        color: black;
        border-radius: 10px;
        font-size: 18px;
        cursor: pointer;
        border: none;
        font-weight: bold;
        text-transform: uppercase;
        transition: 0.3s;
    }

    .b-entrar:hover {
        background-color: #a90000;
        color: white;
    }

    .link-voltar {
        display: block;
        margin-top: 20px;
        color: white;
        font-size: 19px;
        text-decoration: none;
        background-color: #a90000;
        border-radius: 10px;
        max-width: 60%;
        margin-left: 70px;
        
    }

    .link-voltar:hover {
        text-decoration: underline;
    }

    .link-redefinir {
        display: block;
        color: #888;
        font-size: 13px;
        text-decoration: none;
        transition: 0.3s;
        position: absolute;
        bottom: 20px;
    }

    .link-redefinir:hover {
        color: #fff;
    }
</style>
</body>
</html>
